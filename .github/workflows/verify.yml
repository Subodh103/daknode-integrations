name: Verify integrations
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check_distribution.py
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [langchain, google-adk, livekit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r examples/python/requirements-${{ matrix.framework }}.txt pytest==9.1.1
      - run: python -m pytest -q examples/python/test_examples.py
        env:
          FRAMEWORK: ${{ matrix.framework }}
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
